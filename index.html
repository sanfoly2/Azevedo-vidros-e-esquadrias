<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Azevedo Vidros e Esquadrias - Japeri RJ</title>
<link rel="manifest" href="manifest.json">

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{overflow-x:clip;max-width:100vw;-webkit-overflow-scrolling:touch;}
:root{--azul-escuro:#0d2b4e;--azul-medio:#1a4d8f;--azul-preco:#1565c0;--amarelo:#f5b400;--laranja:#ff6b00;--laranja-claro:#fff3e6;--verde-wpp:#25D366;--cinza-bg:#f4f5f7;--cinza-borda:#e4e7ec;--texto:#1a2332;--texto-suave:#6b7280;--sombra:0 2px 12px rgba(15,40,80,.08);}
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--cinza-bg);color:var(--texto);padding-bottom:200px;line-height:1.4;}
.header{background:linear-gradient(135deg,#0d2b4e 0%,#123a63 100%);padding:18px 16px 20px;}
.header-topo{display:flex;align-items:center;gap:14px;}
.header-texto{flex:1;color:#fff;line-height:1.1;}
.header-texto h1{font-size:30px;font-weight:900;letter-spacing:-.5px;}
.header-texto p{font-size:14px;font-weight:800;color:#ffd54f;letter-spacing:2px;margin-top:4px;}
.header-sub{display:inline-block;font-size:13px;font-weight:800;color:#ffd54f;letter-spacing:.5px;margin-top:6px;opacity:.9;}
.busca-wrap{position:relative;flex:1;}
.busca-wrap input{width:100%;padding:11px 42px 11px 16px;border:none;border-radius:12px;font-size:13.5px;outline:none;background:#fff;color:var(--texto);box-shadow:var(--sombra);}
.busca-wrap input::placeholder{color:#9aa4b2;}
.busca-wrap .icon-lupa{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:15px;pointer-events:none;color:var(--laranja);}
.busca-sticky{position:sticky;top:0;z-index:99;background:linear-gradient(180deg,#0d2b4e,#123a63);padding:10px 12px;display:flex;gap:8px;align-items:center;box-shadow:0 2px 12px rgba(0,0,0,.25);}
.icone-sticky{position:relative;width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#ffc93c,#f5a623);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;flex-shrink:0;box-shadow:0 2px 8px rgba(245,180,0,.35);}
.icone-sticky svg{width:22px;height:22px;fill:#0d2b4e;}
.icone-sticky .badge-topo{position:absolute;top:-4px;right:-4px;background:#e53935;color:#fff;border-radius:20px;font-size:10px;font-weight:900;padding:2px 6px;min-width:18px;text-align:center;box-shadow:0 2px 6px rgba(229,57,53,.5);}
.filtros-bar{background:linear-gradient(180deg,#123a63,#0d2b4e);padding:16px 16px 18px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;position:fixed;bottom:0;left:0;right:0;z-index:150;box-shadow:0 -3px 12px rgba(0,0,0,.3);}
.filtros-bar::-webkit-scrollbar{display:none;}
.filtro{padding:9px 20px;border-radius:22px;background:transparent;border:1.5px solid rgba(255,255,255,.25);font-size:13px;font-weight:700;color:#cbd5e1;white-space:nowrap;cursor:pointer;}
.filtro.ativo{background:linear-gradient(135deg,#ffc93c,#f5a623);color:#0d2b4e;border-color:transparent;box-shadow:0 2px 8px rgba(245,180,0,.4);}
    .hero-wrap{padding:18px 16px 6px;}
.hero{background:#fff;border-radius:18px;padding:26px 20px 24px;text-align:center;border:2px solid var(--laranja-claro);box-shadow:var(--sombra);}
.hero-tag{display:inline-block;background:var(--laranja-claro);color:var(--laranja);font-size:10px;font-weight:900;letter-spacing:1.8px;padding:6px 14px;border-radius:20px;margin-bottom:14px;}
.hero h2{font-size:26px;font-weight:900;color:var(--azul-escuro);line-height:1.15;letter-spacing:-.5px;margin-bottom:12px;}
.hero p{font-size:13.5px;color:var(--texto-suave);line-height:1.6;margin-bottom:20px;padding:0 6px;}
.btn-wpp-hero{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--verde-wpp);color:#fff;border:none;border-radius:30px;padding:13px 28px;font-size:15px;font-weight:800;cursor:pointer;text-decoration:none;box-shadow:0 4px 14px rgba(37,211,102,.35);}
.btn-wpp-hero svg{width:20px;height:20px;fill:#fff;}
.faixa-promo{background:linear-gradient(90deg,#ff9800,#ff6b00);color:#fff;padding:9px 16px;text-align:center;font-size:12.5px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;box-shadow:0 2px 8px rgba(255,107,0,.3);display:flex;align-items:center;justify-content:center;gap:6px;}
.faixa-promo .raio{font-size:14px;}
.secao-topo{display:flex;align-items:center;justify-content:space-between;padding:22px 16px 12px;}
.secao-titulo{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:900;color:var(--azul-escuro);}
.secao-titulo .estrela{font-size:20px;color:var(--laranja);}
.contador{background:#e8f1fb;color:var(--azul-medio);font-size:12px;font-weight:800;padding:6px 12px;border-radius:20px;}
.produtos{display:grid;grid-template-columns:1fr;gap:16px;padding:0 16px 24px;}
@media(min-width:640px){.produtos{grid-template-columns:1fr 1fr;}}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:var(--sombra);position:relative;}
.card-topo{position:relative;overflow:hidden;}
.etiqueta-info{position:absolute;top:12px;left:12px;background:rgba(13,43,78,.9);color:#fff;font-size:10.5px;font-weight:800;padding:6px 12px;border-radius:20px;letter-spacing:.6px;z-index:5;text-transform:uppercase;}
.etiqueta-destaque{position:absolute;top:12px;right:12px;background:linear-gradient(135deg,#ff9800,#ff6b00);color:#fff;font-size:10.5px;font-weight:900;padding:6px 12px;border-radius:20px;letter-spacing:.6px;z-index:5;display:flex;align-items:center;gap:4px;box-shadow:0 2px 8px rgba(255,107,0,.4);}
.etiqueta-destaque .fogo{display:inline-block;animation:fogo .8s infinite alternate;}
@keyframes fogo{from{transform:scale(1) rotate(-3deg);}to{transform:scale(1.25) rotate(3deg);}}
.carrossel{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;width:100%;}
.carrossel::-webkit-scrollbar{display:none;}
.carrossel img{width:100%;min-width:100%;flex:0 0 100%;height:280px;object-fit:contain;scroll-snap-align:start;cursor:pointer;background:#eef1f4;display:block;padding:6px 0;}
.carrossel-indicador{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:800;padding:4px 10px;border-radius:20px;z-index:5;}
.card-info{padding:14px 16px 16px;}
.card-info h3{font-size:16px;font-weight:800;color:var(--azul-escuro);margin-bottom:8px;}
.card-info .a-partir{font-size:11.5px;color:var(--texto-suave);font-weight:600;margin-bottom:2px;}
.card-info .preco{font-size:24px;font-weight:900;color:var(--azul-preco);margin-bottom:14px;}
.btn-config{width:100%;padding:13px;background:linear-gradient(135deg,#ff9800,#ff6b00);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 2px 8px rgba(255,107,0,.25);}
.btn-wpp-produto{width:100%;padding:11px;background:#fff;color:var(--verde-wpp);border:2px solid var(--verde-wpp);border-radius:10px;font-size:14px;font-weight:800;cursor:pointer;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:6px;}
.btn-wpp-produto:active{background:var(--verde-wpp);color:#fff;}
    .modal-fundo{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:600;display:none;align-items:flex-end;justify-content:center;}
.modal-fundo.aberto{display:flex;}
@media(min-width:640px){.modal-fundo{align-items:center;}}
.modal-admin-fundo{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;display:none;align-items:flex-end;justify-content:center;}
.modal-admin-fundo.aberto{display:flex;}
@media(min-width:640px){.modal-admin-fundo{align-items:center;}}
.modal{background:#fff;width:100%;max-width:500px;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:22px 22px 0 0;animation:subir .3s ease;}
@media(min-width:640px){.modal{border-radius:20px;}}
@keyframes subir{from{transform:translateY(100%);}to{transform:translateY(0);}}
.modal-topo{position:sticky;top:0;background:#fff;padding:16px 20px;border-bottom:1px solid var(--cinza-borda);display:flex;justify-content:space-between;align-items:center;z-index:2;}
.modal-topo h2{font-size:17px;font-weight:900;color:var(--azul-escuro);}
.btn-fechar{background:var(--cinza-bg);border:none;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;color:#666;}
.modal-corpo{padding:18px 20px 26px;}
.preview-foto{width:100%;height:220px;object-fit:contain;background:#eef1f4;border-radius:12px;margin-bottom:18px;display:block;padding:8px;transition:opacity .2s;}
.grupo{margin-bottom:22px;}
.grupo label{display:block;font-size:13px;font-weight:800;margin-bottom:10px;color:var(--azul-escuro);text-transform:uppercase;letter-spacing:.5px;}
.amostra-pelicula{width:100%;max-width:240px;height:200px;object-fit:contain;border-radius:10px;border:2px solid var(--cinza-borda);margin-top:12px;display:block;background:#eef1f4;padding:6px;cursor:pointer;transition:transform .15s;}
.amostra-pelicula:active{transform:scale(.97);}
.amostra-label{font-size:11px;color:var(--texto-suave);font-weight:700;margin-top:6px;text-transform:uppercase;letter-spacing:.5px;}
.observacao-produto{background:#fff8e1;border-left:3px solid var(--amarelo);padding:8px 12px;font-size:11.5px;color:#7a5c00;font-style:italic;line-height:1.5;border-radius:6px;margin-bottom:16px;margin-top:-8px;}
.opcoes{display:flex;flex-wrap:wrap;gap:8px;}
.opcao{padding:10px 16px;border:2px solid var(--cinza-borda);border-radius:10px;background:#fff;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--texto);}
.opcao.ativa{border-color:var(--azul-medio);background:#e8f1fb;color:var(--azul-medio);}
.qty-control{display:flex;align-items:center;gap:14px;background:#fff;border:2px solid var(--cinza-borda);border-radius:10px;padding:6px 14px;width:fit-content;}
.qty-control button{width:36px;height:36px;border-radius:50%;border:none;background:#e8f1fb;color:var(--azul-medio);font-size:22px;font-weight:900;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center;}
.qty-control button:active{transform:scale(.92);}
.qty-control #qtyValor{font-size:20px;font-weight:900;min-width:36px;text-align:center;color:var(--azul-escuro);}
.resumo{background:var(--cinza-bg);border-radius:12px;padding:14px;margin-bottom:16px;}
.resumo-linha{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px;color:var(--texto-suave);}
.resumo-linha.total{font-size:19px;font-weight:900;color:var(--azul-preco);margin-top:10px;padding-top:10px;border-top:2px dashed #cbd5e1;margin-bottom:0;}
.btn-add{width:100%;padding:15px;background:var(--verde-wpp);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer;}
.item-carrinho{background:var(--cinza-bg);border-radius:12px;padding:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.item-carrinho .info{flex:1;}
.item-carrinho h4{font-size:14px;font-weight:800;margin-bottom:4px;color:var(--azul-escuro);}
.item-carrinho p{font-size:12px;color:var(--texto-suave);line-height:1.5;}
.item-carrinho .qtd-carrinho{display:inline-block;background:var(--azul-medio);color:#fff;font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;margin-top:6px;}
.item-carrinho .valor{font-size:15px;font-weight:900;color:var(--azul-preco);white-space:nowrap;}
.btn-remover{background:none;border:none;color:#e53935;font-size:17px;cursor:pointer;padding:4px;}
.vazio{text-align:center;padding:36px 20px;color:#9aa4b2;font-size:14px;}
.btn-wpp-enviar{width:100%;padding:15px;background:var(--verde-wpp);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer;margin-top:10px;}
.btn-pdf{width:100%;padding:15px;background:linear-gradient(135deg,#1565c0,#0d47a1);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer;margin-top:10px;box-shadow:0 2px 8px rgba(21,101,192,.3);}
.btn-pdf:active{transform:scale(.98);}
.btn-editar-dados{width:100%;padding:13px;background:#fff;color:var(--azul-medio);border:2px solid var(--azul-medio);border-radius:12px;font-size:14px;font-weight:800;cursor:pointer;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:6px;}
.btn-editar-dados:active{background:#e8f1fb;}
    .wpp-flutuante{position:fixed;bottom:160px;right:18px;background:var(--verde-wpp);color:#fff;border:none;border-radius:50%;width:52px;height:52px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(37,211,102,.45);cursor:pointer;z-index:200;text-decoration:none;}
.wpp-flutuante svg{width:28px;height:28px;fill:#fff;}
.btn-instalar-app{position:fixed;bottom:110px;right:18px;background:linear-gradient(135deg,#0d2b4e,#1565c0);color:#fff;border:none;border-radius:50%;width:52px;height:52px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(13,43,78,.5);cursor:pointer;z-index:200;text-decoration:none;animation:pulsa 2s infinite;}
.btn-instalar-app.ativo{display:flex;}
.btn-instalar-app svg{width:26px;height:26px;fill:#fff;}
@keyframes pulsa{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:900;display:none;align-items:center;justify-content:center;}
.lightbox.aberto{display:flex;}
.lightbox-carrossel{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;width:100%;height:100%;align-items:center;}
.lightbox-carrossel::-webkit-scrollbar{display:none;}
.lightbox-carrossel img{min-width:100%;width:100%;max-height:88vh;object-fit:contain;scroll-snap-align:center;padding:0 10px;}
.lightbox .fechar-lb{position:absolute;top:20px;right:20px;background:rgba(255,255,255,.2);color:#fff;border:none;width:44px;height:44px;border-radius:50%;font-size:22px;cursor:pointer;z-index:5;}
.lightbox-contador{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;padding:6px 16px;border-radius:20px;font-size:13px;font-weight:800;letter-spacing:.5px;}
.toast{position:fixed;bottom:160px;left:50%;transform:translateX(-50%) translateY(120px);background:#0d2b4e;color:#fff;padding:14px 26px;border-radius:30px;font-size:14px;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.3);z-index:999;opacity:0;transition:all .3s ease;pointer-events:none;white-space:nowrap;}
.toast.ativo{transform:translateX(-50%) translateY(0);opacity:1;}
footer{text-align:center;padding:26px 16px;font-size:12px;color:#9aa4b2;}
footer strong{color:var(--azul-escuro);}
.campo-form{margin-bottom:14px;}
.campo-form label{display:block;font-size:12px;font-weight:800;color:var(--azul-escuro);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.campo-form input{width:100%;padding:12px 14px;border:2px solid var(--cinza-borda);border-radius:10px;font-size:14px;outline:none;font-family:inherit;color:var(--texto);background:#fff;}
.campo-form input:focus{border-color:var(--azul-medio);}
.linha-dupla{display:flex;gap:10px;}
.linha-dupla .campo-form{flex:1;}
.obrigatorio{color:#e53935;font-weight:900;}
.opcional{color:#9aa4b2;font-weight:700;font-size:10px;}
.aviso-cliente{background:#fff8e1;border-left:4px solid var(--amarelo);padding:10px 12px;font-size:11.5px;color:#555;line-height:1.5;border-radius:6px;margin-bottom:16px;}
.campo-form input:disabled{background:#f4f5f7;color:#9aa4b2;font-style:italic;}
.btn-admin-flutuante{position:fixed;bottom:90px;left:18px;background:linear-gradient(135deg,#0d2b4e,#1565c0);color:#fff;border:none;border-radius:50%;width:48px;height:48px;display:none;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(13,43,78,.5);cursor:pointer;z-index:180;}
.btn-admin-flutuante svg{width:22px;height:22px;fill:#fff;}
.btn-admin-flutuante:active{transform:scale(.92);}
</style>
</head>

    /* ============================================================
   FORMATAÇÃO DE MEDIDAS
   ============================================================ */
function formatarMedida(valor) {
  const num = parseInt(valor);
  if (isNaN(num)) return valor;
  if (num < 1000) {
    return (num / 10) + 'cm';
  }
  return (num / 1000).toFixed(2).replace('.', ',') + 'm';
}

function formatarMedidaCompleta(medidaStr) {
  if (!medidaStr) return '';
  const partes = medidaStr.split('x');
  if (partes.length === 2) {
    return formatarMedida(partes[0]) + ' × ' + formatarMedida(partes[1]);
  }
  return formatarMedida(medidaStr);
}

/* ============================================================
   MENOR PREÇO
   ============================================================ */
function getMenorPreco(produto) {
  let menor = Infinity;
  const base = produto.precosBase;
  if (produto.folhas && produto.alturas) {
    for (const f in base) for (const a in base[f]) for (const m in base[f][a]) if (base[f][a][m] < menor) menor = base[f][a][m];
  } else if (produto.folhas) {
    for (const f in base) for (const m in base[f]) if (base[f][m] < menor) menor = base[f][m];
  } else if (produto.alturas) {
    for (const a in base) for (const m in base[a]) if (base[a][m] < menor) menor = base[a][m];
  } else {
    for (const m in base) if (base[m] < menor) menor = base[m];
  }
  return menor === Infinity ? 0 : menor;
}

  const todas = [];
  for (const chave in produto.imagens) {
    const valor = produto.imagens[chave];

    if (Array.isArray(valor)) {
      valor.forEach(src => {
        let folha = null, cor = null;
        if (produto.folhas) {
          const partes = chave.split('_');
          folha = partes[0];
          cor = partes[1];
        } else {
          cor = chave;
        }
        todas.push({ src: urlFoto(src), folha, cor });
      });
    } else {
      for (const versaoId in valor) {
        valor[versaoId].forEach(src => {
          todas.push({ src: urlFoto(src), folha: null, cor: chave, versao: versaoId });
        });
      }
    }
  }
  return todas;
}

/* ============================================================
   MONTAR ETIQUETA
   ============================================================ */
function montarEtiqueta(folha, cor) {
  if (!folha) return cor.toUpperCase();
  const textoFolha = folha === '1' ? '1 FOLHA' : folha + ' FOLHAS';
  return textoFolha + ' / ' + cor.toUpperCase();
}

/* ============================================================
   NOME BONITO DA PELÍCULA
   ============================================================ */
function nomePelicula(p) {
  if (!p || p === 'nenhuma') return 'Nenhuma';
  return p.charAt(0).toUpperCase() + p.slice(1);
}

/* ============================================================
   FOTO DE PREVIEW DO MODAL
   ============================================================ */
function getFotoPreview(prod, folha, cor) {
  let chave;
  if (prod.folhas) {
    chave = folha + '_' + cor;
  } else {
    chave = cor;
  }
  const val = prod.imagens[chave];
  if (!val) return '';

  if (Array.isArray(val)) {
    return val.length ? urlFoto(val[0]) : '';
  }

  const versao = configAtual && configAtual.versao ? configAtual.versao : prod.versaoPadrao;
  const arr = val[versao];
  return arr && arr.length ? urlFoto(arr[0]) : '';
}

    /* ============================================================
   RENDERIZAR VITRINE
   ============================================================ */
function renderizarVitrine(lista) {
  const vitrine = document.getElementById('vitrine');
  const contador = document.getElementById('contadorProdutos');
  vitrine.innerHTML = '';
  if (contador) contador.textContent = lista.length + ' produto(s)';

  if (lista.length === 0) {
    vitrine.innerHTML = '<div class="vazio">Nenhum produto encontrado 😕</div>';
    return;
  }

  lista.forEach(prod => {
    const card = document.createElement('div');
    card.className = 'card';

    const fotos = getTodasFotos(prod);

    let tagInicial = '';
    if (fotos[0]) tagInicial = montarEtiqueta(fotos[0].folha, fotos[0].cor);

    let etiquetaDestaqueHTML = '';
    if (prod.etiqueta) {
      etiquetaDestaqueHTML = `
        <div class="etiqueta-destaque">
          ${prod.etiqueta.fogo ? '<span class="fogo">🔥</span>' : ''}
          ${prod.etiqueta.texto}
        </div>`;
    }

    const imagensHTML = fotos.map((foto, i) =>
      `<img src="${foto.src}" alt="${prod.nome}" loading="lazy" onclick="abrirLightbox('${prod.id}', ${i})" onerror="this.style.opacity='.3'">`
    ).join('');

    card.innerHTML = `
      <div class="card-topo">
        <div class="etiqueta-info" id="tag-${prod.id}">${tagInicial}</div>
        ${etiquetaDestaqueHTML}
        <div class="carrossel" id="carrossel-${prod.id}">${imagensHTML}</div>
        <div class="carrossel-indicador" id="indicador-${prod.id}">1 / ${fotos.length}</div>
      </div>
      <div class="card-info">
        <h3>${prod.nome}</h3>
        <div class="a-partir">A partir de</div>
        <div class="preco">R$ ${getMenorPreco(prod).toFixed(2).replace('.', ',')}</div>
        <button class="btn-config" onclick="abrirConfig('${prod.id}')">Configurar e Orçar</button>
        <button class="btn-wpp-produto" onclick="abrirWhatsAppProduto('${prod.id}')">💬 Tirar dúvida no WhatsApp</button>
      </div>
    `;

    vitrine.appendChild(card);

    setTimeout(() => {
      const carrossel = document.getElementById('carrossel-' + prod.id);
      const tag = document.getElementById('tag-' + prod.id);
      const indicador = document.getElementById('indicador-' + prod.id);
      if (carrossel && indicador) {
        carrossel.onscroll = () => {
          const idx = Math.round(carrossel.scrollLeft / carrossel.clientWidth);
          const foto = fotos[idx];
          if (foto && tag) tag.textContent = montarEtiqueta(foto.folha, foto.cor);
          indicador.textContent = `${idx + 1} / ${fotos.length}`;
        };
      }
    }, 30);
  });
}

/* ============================================================
   BUSCA
   ============================================================ */
function buscarProduto() {
  const termo = document.getElementById('campoBusca').value.toLowerCase().trim();
  const botaoAtivo = document.querySelector('.filtro.ativo');
  const categoria = botaoAtivo ? botaoAtivo.getAttribute('data-cat') : 'todos';
  aplicarFiltroEBusca(categoria, termo);
}

/* ============================================================
   FILTRO
   ============================================================ */
function filtrar(categoria, botao) {
  document.querySelectorAll('.filtro').forEach(b => b.classList.remove('ativo'));
  botao.classList.add('ativo');
  const termo = document.getElementById('campoBusca').value.toLowerCase().trim();
  aplicarFiltroEBusca(categoria, termo);
}

function filtrarEVoltar(categoria, botao) {
  filtrar(categoria, botao);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function aplicarFiltroEBusca(categoria, termo) {
  let lista = PRODUTOS;
  if (categoria === 'janela') lista = lista.filter(p => p.categoria === 'janela');
  else if (categoria === 'porta') lista = lista.filter(p => p.categoria === 'porta');
  else if (categoria === 'bascula') lista = lista.filter(p => p.categoria === 'bascula');
  else if (categoria === 'box') lista = lista.filter(p => p.categoria === 'box');
  else if (categoria === 'sacada') lista = lista.filter(p => p.categoria === 'sacada');
  if (termo) lista = lista.filter(p => p.nome.toLowerCase().includes(termo));
  renderizarVitrine(lista);
}
    /* ============================================================
   LIGHTBOX
   ============================================================ */
function abrirLightbox(produtoId, indexFoto) {
  const prod = PRODUTOS.find(p => p.id === produtoId);
  if (!prod) return;

  lightboxFotos = getTodasFotos(prod);
  lightboxIndex = indexFoto || 0;

  const carrossel = document.getElementById('lightboxCarrossel');
  carrossel.innerHTML = lightboxFotos.map(foto =>
    `<img src="${foto.src}" alt="${prod.nome}" onerror="this.style.opacity='.3'">`
  ).join('');

  document.getElementById('lightbox').classList.add('aberto');

  setTimeout(() => {
    carrossel.scrollLeft = lightboxIndex * carrossel.clientWidth;
    atualizarContadorLightbox();
  }, 50);

  carrossel.onscroll = () => {
    const idx = Math.round(carrossel.scrollLeft / carrossel.clientWidth);
    lightboxIndex = idx;
    atualizarContadorLightbox();
  };
}

function atualizarContadorLightbox() {
  const cont = document.getElementById('lightboxContador');
  if (cont) cont.textContent = `${lightboxIndex + 1} / ${lightboxFotos.length}`;
}

function fecharLightbox() {
  document.getElementById('lightbox').classList.remove('aberto');
  document.getElementById('lightboxCarrossel').innerHTML = '';
  lightboxFotos = [];
  lightboxIndex = 0;
}

function abrirLightboxSimples(src) {
  lightboxFotos = [{ src: src }];
  lightboxIndex = 0;

  const carrossel = document.getElementById('lightboxCarrossel');
  carrossel.innerHTML = `<img src="${src}" alt="Amostra" onerror="this.style.opacity='.3'">`;
  carrossel.onscroll = null;
  carrossel.scrollLeft = 0;

  document.getElementById('lightbox').classList.add('aberto');
  atualizarContadorLightbox();
}

function abrirConfig(produtoId) {
  const prod = PRODUTOS.find(p => p.id === produtoId);
  if (!prod) return;

  const folhaInicial = prod.folhas ? prod.folhas[0] : null;
  const alturaInicial = prod.alturas ? prod.alturas[0] : null;

  let medidaInicial;
  if (prod.folhas && prod.alturas) {
    medidaInicial = Object.keys(prod.precosBase[folhaInicial][alturaInicial])[0];
  } else if (prod.folhas) {
    medidaInicial = Object.keys(prod.precosBase[folhaInicial])[0];
  } else if (prod.alturas) {
    medidaInicial = Object.keys(prod.precosBase[alturaInicial])[0];
  } else {
    medidaInicial = Object.keys(prod.precosBase)[0];
  }

  let puxadorInicial = null;
  let fechaduraInicial = null;
  if (prod.temPuxador) {
    puxadorInicial = prod.puxadorPadrao;
    if (prod.fechaduraObrigatoria && !puxadorInicial) puxadorInicial = 'sim';
  }
  if (prod.temFechadura) {
    fechaduraInicial = prod.fechaduraPadrao;
    if (prod.fechaduraObrigatoria) fechaduraInicial = 'nao';
  }

  configAtual = {
    produtoId: produtoId,
    folha: folhaInicial,
    altura: alturaInicial,
    medida: medidaInicial,
    vidro: prod.vidros ? prod.vidros[0] : null,
    versao: prod.versoes ? prod.versaoPadrao : null,
    cor: prod.cores[0],
    puxador: puxadorInicial,
    fechadura: fechaduraInicial,
    lambri: prod.tiposLambri ? prod.lambriPadrao : null,
    pelicula: prod.peliculas ? 'nenhuma' : null,
    pagamento: 'pix',
    quantidade: 1
  };

  document.getElementById('modalTitulo').textContent = prod.nome;
  montarModal();
  document.getElementById('modalFundo').classList.add('aberto');
}

/* ============================================================
   MUDAR QUANTIDADE
   ============================================================ */
function mudarQtd(delta) {
  const nova = configAtual.quantidade + delta;
  if (nova < 1) return;
  if (nova > 99) return;
  configAtual.quantidade = nova;
  montarModal();
}
  /* ============================================================
   SETTERS
   ============================================================ */
function setFolha(f) {
  configAtual.folha = f;
  const prod = PRODUTOS.find(p => p.id === configAtual.produtoId);
  if (prod.alturas) {
    configAtual.medida = Object.keys(prod.precosBase[f][configAtual.altura])[0];
  } else {
    configAtual.medida = Object.keys(prod.precosBase[f])[0];
  }
  if (prod.peliculaSoFolha && configAtual.folha !== prod.peliculaSoFolha) {
    configAtual.pelicula = 'nenhuma';
  }
  montarModal();
}

function setAltura(a) {
  configAtual.altura = a;
  const prod = PRODUTOS.find(p => p.id === configAtual.produtoId);
  if (prod.folhas) {
    configAtual.medida = Object.keys(prod.precosBase[configAtual.folha][a])[0];
  } else {
    configAtual.medida = Object.keys(prod.precosBase[a])[0];
  }
  montarModal();
}

function setMedida(m) { configAtual.medida = m; montarModal(); }
function setVidro(v) { configAtual.vidro = v; montarModal(); }
function setCor(c) { configAtual.cor = c; montarModal(); }

function setVersao(v) {
  configAtual.versao = v;
  const prod = PRODUTOS.find(p => p.id === configAtual.produtoId);
  if (prod.coresPorVersao && prod.coresPorVersao[v]) {
    const coresValidas = prod.coresPorVersao[v];
    if (!coresValidas.includes(configAtual.cor)) {
      configAtual.cor = coresValidas[0];
    }
  }
  montarModal();
}

function setPuxador(p) {
  configAtual.puxador = p;
  if (p === 'sim') configAtual.fechadura = 'nao';
  montarModal();

  /* ============================================================
   CÁLCULO DE PREÇO
   ============================================================ */
function calcularPreco() {
  const prod = PRODUTOS.find(p => p.id === configAtual.produtoId);

  let base;
  if (prod.folhas && prod.alturas) {
    base = prod.precosBase[configAtual.folha][configAtual.altura][configAtual.medida];
  } else if (prod.folhas) {
    base = prod.precosBase[configAtual.folha][configAtual.medida];
  } else if (prod.alturas) {
    base = prod.precosBase[configAtual.altura][configAtual.medida];
  } else {
    base = prod.precosBase[configAtual.medida];
  }

  const addVidro = (!prod.vidros || prod.vidrosSemTaxa.includes(configAtual.vidro)) ? 0 : ADICIONAIS.vidroColorido;

  const subtotal1 = base + addVidro;
  const addCor = prod.coresSemTaxa.includes(configAtual.cor) ? 0 : subtotal1 * ADICIONAIS.taxaCor;

  const addPuxador = (prod.temPuxador && configAtual.puxador === 'sim' && !prod.puxadorGratis) ? ADICIONAIS.puxador : 0;

  const addFechadura = (prod.temFechadura && configAtual.fechadura === 'sim') ? ADICIONAIS.fechadura : 0;

  const temPelicula = configAtual.pelicula && configAtual.pelicula !== 'nenhuma';
  const addPelicula = temPelicula ? ADICIONAIS.pelicula : 0;

  const subtotal2 = subtotal1 + addCor + addPuxador + addFechadura + addPelicula;
  const addCartao = configAtual.pagamento === 'cartao' ? subtotal2 * ADICIONAIS.taxaCartao : 0;

  const total = subtotal2 + addCartao;

  return { base, addVidro, addCor, addPuxador, addFechadura, addPelicula, addCartao, total };
}

function adicionarAoCarrinho() {
  const prod = PRODUTOS.find(p => p.id === configAtual.produtoId);

/* ============================================================
   FORMATAR DETALHES DO ITEM
   ============================================================ */
function detalhesItem(item) {
  let detalhes = [];
  if (item.temFolhas) detalhes.push(item.folha === '1' ? '1 folha' : item.folha + ' folhas');
  if (item.temAltura && item.temFolhas) {
    detalhes.push(`Medida: ${formatarMedida(item.medida)} × ${formatarMedida(item.altura)}`);
  } else if (item.temAltura) {
    detalhes.push(`Medida: ${formatarMedidaCompleta(item.medida)} · Altura: ${formatarMedida(item.altura)}`);
  } else {
    detalhes.push(`Medida: ${formatarMedidaCompleta(item.medida)}`);
  }
  if (item.versao) {
    const prodRef = PRODUTOS.find(p => p.nome === item.produto);
    if (prodRef && prodRef.versoes) {
      const v = prodRef.versoes.find(x => x.id === item.versao);
      if (v) detalhes.push(v.nome);
    }
  }
  if (item.lambri) {
    const prodRef = PRODUTOS.find(p => p.nome === item.produto);
    if (prodRef && prodRef.tiposLambri) {
      const t = prodRef.tiposLambri.find(x => x.id === item.lambri);
      if (t) detalhes.push(t.nome);
    }
  }
  if (item.vidro) detalhes.push(`Vidro: ${item.vidro}`);
  detalhes.push(`Alumínio: ${item.cor}`);
  if (item.temPuxador && item.puxador === 'sim') detalhes.push('Com puxador');
  if (item.temFechadura && item.fechadura === 'sim') detalhes.push('Com fechadura e maçaneta');
  if (item.pelicula && item.pelicula !== 'nenhuma') detalhes.push(`Película: ${item.pelicula}`);
  detalhes.push(`Pagamento: ${item.pagamento === 'pix' ? 'Pix/Dinheiro' : 'Cartão'}`);
  return detalhes.join(' · ');
}

function mascaraTelefone(el) {
  let v = el.value.replace(/\D/g, '');
  if (v.length > 11) v = v.slice(0, 11);
  if (v.length > 10) v = v.replace(/(\d{2})(\d{5})(\d{4})/, '($1) $2-$3');
  else if (v.length > 6) v = v.replace(/(\d{2})(\d{4})(\d{0,4})/, '($1) $2-$3');
  else if (v.length > 2) v = v.replace(/(\d{2})(\d{0,5})/, '($1) $2');
  else if (v.length > 0) v = v.replace(/(\d{0,2})/, '($1');
  el.value = v;
}

function mascaraCEP(el) {
  let v = el.value.replace(/\D/g, '');
  if (v.length > 8) v = v.slice(0, 8);
  if (v.length > 5) v = v.replace(/(\d{5})(\d{0,3})/, '$1-$2');
  el.value = v;

  if (v.length === 8) {
    buscarCEP(v);
  }
}

function buscarCEP(cep) {
  const cepLimpo = cep.replace(/\D/g, '');
  if (cepLimpo.length !== 8) return;

  const campoEndereco = document.getElementById('cliEndereco');
  if (!campoEndereco) return;

  campoEndereco.value = 'Buscando endereço...';
  campoEndereco.disabled = true;

  fetch('https://viacep.com.br/ws/' + cepLimpo + '/json/')
    .then(r => r.json())
    .then(dados => {
      campoEndereco.disabled = false;
      if (dados.erro) {
        campoEndereco.value = '';
        campoEndereco.placeholder = 'CEP não encontrado - digite o endereço';
        alert('⚠️ CEP não encontrado. Digite o endereço manualmente.');
        return;
      }
      const endereco = dados.logradouro || '';
      const bairro = dados.bairro ? ' - ' + dados.bairro : '';
      campoEndereco.value = endereco + bairro;
      const campoNumero = document.getElementById('cliNumero');
      if (campoNumero) campoNumero.focus();
    })
    .catch(err => {
      campoEndereco.disabled = false;
      campoEndereco.value = '';
      console.log('Erro ao buscar CEP:', err);
      alert('⚠️ Não foi possível buscar o CEP. Digite o endereço manualmente.');
    });
}

// Valida o login
function fazerLoginAdmin() {
  const nome = document.getElementById('adminNome').value.trim();
  const senha = document.getElementById('adminSenha').value;

  const admin = ADMINS.find(a => a.nome === nome && a.senha === senha);

  if (!admin) {
    document.getElementById('adminErro').style.display = 'block';
    return;
  }

  adminLogado = admin;

  try {
    localStorage.setItem('azevedoAdmin', JSON.stringify({
      nome: admin.nome,
      senha: admin.senha,
      expira: Date.now() + (7 * 24 * 60 * 60 * 1000)
    }));
  } catch (e) {}

  document.getElementById('modalAdminLogin').remove();
  mostrarToast('👋 Olá, ' + admin.nome + '!');

  const btn = document.getElementById('btnAdminFlutuante');
  if (btn) btn.style.display = 'flex';
}

// Restaura o login salvo (7 dias)
function restaurarLoginAdmin() {
  try {
    const salvo = localStorage.getItem('azevedoAdmin');
    if (!salvo) return;

    const dados = JSON.parse(salvo);
    if (!dados.expira || dados.expira < Date.now()) {
      localStorage.removeItem('azevedoAdmin');
      return;
    }

    const admin = ADMINS.find(a => a.nome === dados.nome && a.senha === dados.senha);
    if (admin) {
      adminLogado = admin;
      const btn = document.getElementById('btnAdminFlutuante');
      if (btn) btn.style.display = 'flex';
    }
  } catch (e) {}
}

// Logout
function logoutAdmin() {
  if (!confirm('Sair do modo admin?')) return;
  try { localStorage.removeItem('azevedoAdmin'); } catch (e) {}
  adminLogado = null;
  const btn = document.getElementById('btnAdminFlutuante');
  if (btn) btn.style.display = 'none';
  mostrarToast('👋 Até logo!');
}

function adicionarItemPersonalizado() {
  const produto = document.getElementById('persProduto').value.trim();
  const medidas = document.getElementById('persMedidas').value.trim();
  const observacao = document.getElementById('persObs').value.trim();
  let valorUnit = parseFloat(document.getElementById('persValor').value) || 0;
  const quantidade = parseInt(document.getElementById('persQtd').value) || 1;
  const pagamento = document.getElementById('persPagamento').value;

  if (!produto || !medidas || valorUnit <= 0) {
    alert('⚠️ Preencha Produto, Medidas e Valor unitário.');
    return;
  }

  // Aplica taxa do cartão
  if (pagamento === 'cartao') valorUnit = valorUnit * 1.07;

  const item = {
    id: Date.now(),
    produto: produto,
    personalizado: true,
    descricaoPersonalizada: 'Medidas: ' + medidas + (observacao ? ' · ' + observacao : ''),
    pagamento: pagamento,
    quantidade: quantidade,
    precoUnitario: valorUnit,
    total: valorUnit * quantidade
  };

  carrinho.push(item);
  atualizarBadge();
  salvarCarrinho();
  document.getElementById('modalItemPersonalizado').remove();
  mostrarToast('✅ Adicionado ao carrinho!');

function esconderBotaoSeInstalado() {
  const btn = document.getElementById('btnInstalarApp');
  if (!btn) return;

  const standalone = window.matchMedia('(display-mode: standalone)').matches ||
                     window.navigator.standalone === true;

  const jaInstalou = localStorage.getItem('azevedoAppInstalado') === 'sim';

  if (standalone || jaInstalou) {
    btn.style.display = 'none';
  }
}

function verificarAdminURL() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('admin') === '1') {
    if (adminLogado) {
      setTimeout(() => abrirPainelAdmin(), 300);
    } else {
      setTimeout(() => abrirLoginAdmin(), 300);
    }
  }
}
